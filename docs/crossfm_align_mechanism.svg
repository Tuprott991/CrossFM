    <rect x="274" y="638" width="16" height="82"/><rect x="298" y="682" width="16" height="38"/>
    <rect x="322" y="704" width="16" height="16"/><rect x="346" y="692" width="16" height="28"/>
    <rect x="370" y="709" width="16" height="11"/><rect x="394" y="701" width="16" height="19"/>
    <rect x="418" y="712" width="16" height="8"/><rect x="442" y="708" width="16" height="12"/>
  </g>
  <text x="90" y="742" text-anchor="middle" class="tiny">1</text>
  <text x="258" y="742" text-anchor="middle" class="tiny">8</text>
  <text x="450" y="742" text-anchor="middle" class="tiny">16</text>
  <rect x="128" y="758" width="285" height="28" rx="14" fill="#fff" stroke="#777" stroke-width="1.5"/>
  <text x="270" y="777" text-anchor="middle" class="small" font-weight="700">NO ARGMAX · NO DISCRETE FORWARD PASS</text>

  <!-- Panel 2 -->
  <circle cx="567" cy="132" r="22" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
  <text x="567" y="140" text-anchor="middle" class="num">2</text>
  <text x="603" y="140" class="head">Semantic codebook marginalization</text>
  <text x="603" y="164" class="small">Every plausible state votes for compatible feature views.</text>

  <text x="555" y="214" class="label" font-weight="700">Soft posterior</text>
  <text x="755" y="214" class="label" font-weight="700">State-to-view codebook</text>
  <text x="943" y="214" class="small">six candidate views</text>

  <g transform="translate(570 235)">
    <rect width="48" height="288" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
    <g fill="#a9cda6">
      <rect x="6" y="7" width="10" height="8"/><rect x="6" y="25" width="16" height="8"/>

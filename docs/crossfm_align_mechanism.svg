  <text x="800" y="874" text-anchor="middle" class="small" font-weight="700">SOFT UNCERTAINTY IS PRESERVED END-TO-END · THE CODEBOOK ALIGNS VIEWS · THE RESIDUAL GATE PREVENTS DESTRUCTIVE ROUTING</text>

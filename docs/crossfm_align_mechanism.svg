    <text x="0" y="16" class="small">View A</text><rect x="80" y="3" width="315" height="18" rx="4" fill="#eee"/><rect x="80" y="3" width="63" height="18" rx="4" fill="#efb66e"/>
    <text x="0" y="60" class="small">View B</text><rect x="80" y="47" width="315" height="18" rx="4" fill="#eee"/><rect x="80" y="47" width="214" height="18" rx="4" fill="#efb66e"/>
    <text x="0" y="104" class="small">View C</text><rect x="80" y="91" width="315" height="18" rx="4" fill="#eee"/><rect x="80" y="91" width="126" height="18" rx="4" fill="#efb66e"/>
    <text x="0" y="148" class="small">View D</text><rect x="80" y="135" width="315" height="18" rx="4" fill="#eee"/><rect x="80" y="135" width="277" height="18" rx="4" fill="#efb66e"/>
    <text x="0" y="192" class="small">View E</text><rect x="80" y="179" width="315" height="18" rx="4" fill="#eee"/><rect x="80" y="179" width="38" height="18" rx="4" fill="#efb66e"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#161616"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777"/>
    </marker>
    <style>
      .title{font: 30px Georgia,serif;fill:#111}
      .subtitle{font: 15px Helvetica,Arial,sans-serif;fill:#555}
      .head{font:700 20px Helvetica,Arial,sans-serif;fill:#111}
      .label{font:15px Helvetica,Arial,sans-serif;fill:#222}
      .small{font:12px Helvetica,Arial,sans-serif;fill:#555}
      .tiny{font:10px Helvetica,Arial,sans-serif;fill:#555}
      .num{font:700 22px Helvetica,Arial,sans-serif;fill:#222}
      .box{stroke:#161616;stroke-width:2.5}
      .arrow{fill:none;stroke:#161616;stroke-width:2.5;marker-end:url(#arrow)}
      .guide{fill:none;stroke:#aaa;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="48" text-anchor="middle" class="title">CrossFM-Align: Posterior–Codebook–Residual Routing</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Uncertainty is preserved from statistical sensing to semantic view selection and fallback control</text>

  <line x1="520" y1="112" x2="520" y2="790" stroke="#ddd" stroke-width="2"/>
  <line x1="1080" y1="112" x2="1080" y2="790" stroke="#ddd" stroke-width="2"/>


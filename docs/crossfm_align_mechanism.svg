  <text x="108" y="140" class="head">Soft statistical state posterior</text>
  <text x="108" y="164" class="small">Four uncertain evidence channels induce a distribution—not hard bits.</text>

  <text x="75" y="214" class="label" font-weight="700">Evidence logits</text>
  <g transform="translate(75 238)">

  <text x="850" y="550" text-anchor="middle" class="small">disclosed semantic compatibility map</text>
  <rect x="650" y="590" width="400" height="62" rx="8" fill="#f6d8ae" class="box"/>
  <text x="850" y="616" text-anchor="middle" class="label" font-weight="700">Posterior-weighted codebook aggregation</text>
  <text x="850" y="638" text-anchor="middle" class="small">ambiguous states contribute proportionally</text>
  <path d="M850 523 L850 583" class="arrow"/>
  <rect x="700" y="685" width="300" height="58" rx="8" fill="#f5f2c6" class="box"/>
  <text x="850" y="720" text-anchor="middle" class="label" font-weight="700">Aligned view weights</text>

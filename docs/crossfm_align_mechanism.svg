      <rect x="1" y="163" width="48" height="16"/><rect x="151" y="163" width="48" height="16"/>
      <rect x="51" y="181" width="48" height="16"/><rect x="201" y="181" width="48" height="16"/>
      <rect x="101" y="199" width="48" height="16"/><rect x="251" y="199" width="48" height="16"/>
      <rect x="1" y="217" width="48" height="16"/><rect x="201" y="217" width="48" height="16"/>
      <rect x="51" y="235" width="48" height="16"/><rect x="151" y="235" width="48" height="16"/>
      <rect x="101" y="253" width="48" height="16"/><rect x="251" y="253" width="48" height="16"/>
      <rect x="1" y="271" width="48" height="16"/><rect x="151" y="271" width="48" height="16"/>
    </g>

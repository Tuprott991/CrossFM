  <rect x="1140" y="548" width="360" height="72" rx="8" fill="#c9e7f2" class="box"/>
  <text x="1320" y="578" text-anchor="middle" class="label" font-weight="700">Weighted TFM response bank</text>
  <text x="1320" y="601" text-anchor="middle" class="small">combine candidate-view predictions</text>

  <path d="M1320 620 L1320 660" class="arrow"/>
  <rect x="1120" y="668" width="400" height="72" rx="8" fill="#f5f2c6" class="box"/>
  <text x="1320" y="698" text-anchor="middle" class="label" font-weight="700">Residual preservation gate</text>
  <text x="1320" y="721" text-anchor="middle" class="small">weak evidence → delegate authority to LLM</text>


[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfm"
version = "0.5.0"
description = "Falsifiable CrossFM benchmark and frozen-backbone baseline experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
gpu = [
  "tabicl==2.2.0",
  "transformers==4.57.6",
  "huggingface-hub==0.36.0",
  "safetensors==0.7.0",
]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["crossfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

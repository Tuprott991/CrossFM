[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfm"
version = "0.9.0"
description = "Falsifiable CrossFM benchmark and frozen-backbone baseline experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "python-dotenv==1.0.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
gpu = [
  "tabicl==2.2.0",
  "transformers==4.57.6",
  "huggingface-hub==0.36.0",
  "safetensors==0.7.0",
]
test = ["pytest==8.3.5"]
fullpaper = [
  "pyarrow==18.1.0",
  "openpyxl==3.1.5",
  "data-foundry==0.0.5",
  "catboost==1.2.10",
  "lightgbm==4.7.0",
  "xgboost==3.2.0",
  "tabpfn==9.0.0",
  "tabm==0.0.3",
  "autogluon.tabular==1.6.3",
]

[project.scripts]
crossfm-fullpaper = "crossfm.fullpaper.cli:main"

[tool.setuptools.packages.find]
include = ["crossfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

  methods: [crossfm_r1_shared, crossfm_r2_shared, crossfm_r3_corrective, crossfm_r3_zero_t2l, crossfm_r3_shuffle_t2l, crossfm_r3_t2l_only, crossfm_r3_l2t_only_compute_matched, crossfm_r3_stopgrad_l2t, crossfm_r3_stopgrad_t2l, crossfm_r3_random_bridge]
data:
  train: {seed: 11101, episodes: {A: 2, B: 2, C2: 8}, queries_per_episode: 8, alias_split: train, mechanism_split: train}
  validation: {seed: 11201, episodes: {A: 2, B: 2, C2: 4}, queries_per_episode: 8, alias_split: validation, mechanism_split: validation}
